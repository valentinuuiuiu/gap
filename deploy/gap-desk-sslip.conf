# GAP desk — vhost public (sslip.io codifică IP-ul, deci nu depinde de DNS propriu).
#
# Instalare pe VPS:
#   1. cp deploy/gap-desk-sslip.conf /etc/nginx/sites-available/gap-desk-sslip
#   2. ln -sf /etc/nginx/sites-available/gap-desk-sslip /etc/nginx/sites-enabled/gap-desk-sslip
#   3. certbot certonly --webroot -w /var/www/html -d gap-163-245-213-254.sslip.io
#   4. nginx -t && systemctl reload nginx
#   5. cd /root/gap && PORT=5011 HOST=127.0.0.1 \
#        pm2 start scripts/desk-server.mjs --name gap-desk --node-args="--experimental-strip-types"
#      pm2 save
#
# Serviciul ascultă doar pe 127.0.0.1: nginx e singurul care îl expune.

server {
    listen 80;
    server_name gap-163-245-213-254.sslip.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gap-163-245-213-254.sslip.io;

    ssl_certificate /etc/letsencrypt/live/gap-163-245-213-254.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gap-163-245-213-254.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_pass http://127.0.0.1:5011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
